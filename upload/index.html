<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Upload | Sunflower Plumbing & Excavation</title>
  <meta name="description" content="Internal photo upload portal for Sunflower Plumbing service technicians.">
  <link rel="canonical" href="https://www.sunflowerplumbing.com/upload/">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <meta name="robots" content="noindex, nofollow">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .upload-page {
      min-height: 70vh;
      padding: 60px 0 80px;
      background: var(--light-bg, #f8f6f2);
    }
    .upload-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 44px;
    }
    @media (max-width: 640px) {
      .upload-card { padding: 32px 20px; }
    }
    .upload-card h1 {
      font-size: 26px;
      color: var(--black, #121315);
      margin: 0 0 6px;
    }
    .upload-card .subtitle {
      color: #666;
      font-size: 15px;
      margin: 0 0 36px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #444;
      margin-bottom: 8px;
    }
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      color: var(--black, #121315);
      background: #fafafa;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--yellow, #FCAF18);
      background: #fff;
    }
    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* Multi-select styling */
    .service-checkboxes {
      border: 1.5px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      padding: 10px 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .service-checkboxes:focus-within {
      border-color: var(--yellow, #FCAF18);
      background: #fff;
    }
    .service-check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .service-check-item:hover {
      background: #f4f0eb;
    }
    .service-check-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--yellow, #FCAF18);
      cursor: pointer;
      flex-shrink: 0;
    }
    .service-check-item span {
      font-size: 15px;
      color: var(--black, #121315);
      user-select: none;
    }
    .select-hint {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    /* Voice description */
    .desc-wrapper {
      position: relative;
    }
    .voice-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: var(--yellow, #FCAF18);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--black, #121315);
      font-size: 15px;
      transition: background 0.2s, transform 0.1s;
    }
    .voice-btn:hover { background: #e09c0f; }
    .voice-btn.listening {
      background: #e53935;
      color: #fff;
      animation: pulse-mic 1s infinite;
    }
    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .voice-hint {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }
    .no-voice .voice-btn { display: none; }

    /* File drop zone */
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafafa;
      position: relative;
    }
    .drop-zone.dragover,
    .drop-zone:hover {
      border-color: var(--yellow, #FCAF18);
      background: #fffbf0;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon {
      font-size: 36px;
      color: #ccc;
      margin-bottom: 10px;
    }
    .drop-zone:hover .drop-icon,
    .drop-zone.dragover .drop-icon { color: var(--yellow, #FCAF18); }
    .drop-label {
      font-size: 16px;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 4px;
    }
    .drop-sub {
      font-size: 13px;
      color: #888;
    }

    /* Preview thumbnails */
    #preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .preview-thumb {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      border: 2px solid #eee;
      position: relative;
    }
    .thumb-wrap {
      position: relative;
      display: inline-block;
    }
    .thumb-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    /* Submit button */
    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: var(--yellow, #FCAF18);
      color: var(--black, #121315);
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .submit-btn:hover:not(:disabled) { background: #e09c0f; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Progress bar */
    .progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-track {
      background: #eee;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--yellow, #FCAF18);
      border-radius: 99px;
      transition: width 0.3s;
      width: 0%;
    }
    .progress-label {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      text-align: center;
    }

    /* Result messages */
    .result-msg {
      display: none;
      padding: 16px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 18px;
      text-align: center;
    }
    .result-msg.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .result-msg.error {
      display: block;
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    /* Upload log */
    #upload-log {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .log-item .log-icon { font-size: 14px; }
    .log-item.ok .log-icon { color: #2e7d32; }
    .log-item.err .log-icon { color: #c62828; }
    .log-item.uploading .log-icon { color: #888; }
  </style>
</head>
<body>
<!-- HEADER -->

<section class="upload-page">
  <div class="container">

    <div class="upload-card">
      <h1><i class="fas fa-camera" style="color:var(--yellow,#FCAF18);margin-right:10px;"></i>Photo Upload</h1>
      <p class="subtitle">Select a service, pick your photos, hit upload — done. Description is optional.</p>

      <form id="upload-form" novalidate>

        <!-- Service dropdown (multi-select via checkboxes) -->
        <div class="form-group">
          <label for="service-list">Service <span style="color:#e53935;">*</span></label>
          <div class="service-checkboxes" id="service-list" role="group" aria-label="Select services">
            <label class="service-check-item"><input type="checkbox" name="service" value="Drain Cleaning"><span>Drain Cleaning</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Fixture Replacement"><span>Fixture Replacement</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Gas Line Services"><span>Gas Line Services</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Kitchen & Bathroom Plumbing"><span>Kitchen & Bathroom Plumbing</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Leak Detection"><span>Leak Detection</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Sewer Line Repair"><span>Sewer Line Repair</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Toilet & Faucet Repair"><span>Toilet & Faucet Repair</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Water Heater Repair"><span>Water Heater Repair</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Water Softener Installation"><span>Water Softener Installation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Lateral Field Installation"><span>Lateral Field Installation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Backfill & Grading"><span>Backfill & Grading</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Emergency Excavation"><span>Emergency Excavation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Septic System Excavation"><span>Septic System Excavation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Sewer & Water Line Excavation"><span>Sewer & Water Line Excavation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Site Preparation"><span>Site Preparation</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Trenching"><span>Trenching</span></label>
            <label class="service-check-item"><input type="checkbox" name="service" value="Other"><span>Other</span></label>
          </div>
          <p class="select-hint">Select all that apply.</p>
        </div>

        <!-- Description with voice-to-text -->
        <div class="form-group">
          <label for="description">Description <span style="color:#aaa;font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;">(optional)</span></label>
          <div class="desc-wrapper" id="desc-wrapper">
            <textarea id="description" name="description" placeholder="Optional — location, before/after, what was wrong, etc. Tap the mic to dictate." rows="3"></textarea>
            <button type="button" class="voice-btn" id="voice-btn" title="Tap to use voice-to-text" aria-label="Start voice input">
              <i class="fas fa-microphone" id="mic-icon"></i>
            </button>
          </div>
          <p class="voice-hint" id="voice-hint">Tap the <i class="fas fa-microphone"></i> button to dictate a description.</p>
        </div>

        <!-- Submitter name -->
        <div class="form-group">
          <label for="tech-name">Your Name <span style="color:#e53935;">*</span></label>
          <input type="text" id="tech-name" name="tech_name" placeholder="Tech name or initials"
            style="width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;color:#121315;background:#fafafa;box-sizing:border-box;">
        </div>

        <!-- File picker -->
        <div class="form-group">
          <label>Photos <span style="color:#e53935;">*</span></label>
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" name="photos" accept="image/*" multiple capture="environment">
            <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <span class="drop-label">Tap to select photos</span>
            <span class="drop-sub">or drag & drop here &bull; JPG, PNG, HEIC</span>
          </div>
          <div id="preview-list"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <i class="fas fa-upload"></i>
          <span id="submit-label">Upload Photos</span>
        </button>

        <!-- Progress -->
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
          <div class="progress-label" id="progress-label">Uploading…</div>
        </div>

        <!-- Upload log -->
        <div id="upload-log"></div>

        <!-- Result -->
        <div class="result-msg" id="result-msg"></div>

      </form>
    </div>

  </div>
</section>

<!-- FOOTER -->

<script src="/js/main.js"></script>
<script>
(function() {
  'use strict';

  // ── Voice to text ──────────────────────────────────────────────
  const voiceBtn  = document.getElementById('voice-btn');
  const micIcon   = document.getElementById('mic-icon');
  const voiceHint = document.getElementById('voice-hint');
  const descEl    = document.getElementById('description');
  const descWrap  = document.getElementById('desc-wrapper');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if (!SpeechRecognition) {
    descWrap.classList.add('no-voice');
    voiceHint.textContent = 'Voice input not supported in this browser — type your description above.';
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    let finalTranscript = '';

    recognition.onresult = function(e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript + ' ';
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      descEl.value = finalTranscript + interim;
    };

    recognition.onerror = function(e) {
      stopListening();
      if (e.error !== 'aborted') {
        voiceHint.textContent = 'Mic error: ' + e.error + '. Try typing instead.';
      }
    };

    recognition.onend = function() { stopListening(); };

    voiceBtn.addEventListener('click', function() {
      if (listening) {
        recognition.stop();
      } else {
        finalTranscript = descEl.value.trimEnd() + (descEl.value.trimEnd() ? ' ' : '');
        recognition.start();
        listening = true;
        voiceBtn.classList.add('listening');
        micIcon.className = 'fas fa-stop';
        voiceHint.textContent = 'Listening… tap again to stop.';
      }
    });
  }

  function stopListening() {
    listening = false;
    voiceBtn.classList.remove('listening');
    micIcon.className = 'fas fa-microphone';
    voiceHint.textContent = 'Tap the mic button to dictate a description.';
  }

  // ── File picker & previews ─────────────────────────────────────
  const fileInput   = document.getElementById('file-input');
  const dropZone    = document.getElementById('drop-zone');
  const previewList = document.getElementById('preview-list');
  let selectedFiles = [];

  function addFiles(fileList) {
    for (const f of fileList) {
      if (!f.type.startsWith('image/')) continue;
      if (selectedFiles.some(x => x.name === f.name && x.size === f.size)) continue;
      selectedFiles.push(f);
      renderThumb(f, selectedFiles.length - 1);
    }
  }

  function renderThumb(file, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.dataset.idx = idx;

    const img = document.createElement('img');
    img.className = 'preview-thumb';
    img.alt = file.name;
    const url = URL.createObjectURL(file);
    img.src = url;
    img.onload = () => URL.revokeObjectURL(url);

    const rm = document.createElement('button');
    rm.className = 'thumb-remove';
    rm.type = 'button';
    rm.innerHTML = '&times;';
    rm.title = 'Remove';
    rm.onclick = function() {
      selectedFiles.splice(idx, 1);
      refreshPreviews();
    };

    wrap.appendChild(img);
    wrap.appendChild(rm);
    previewList.appendChild(wrap);
  }

  function refreshPreviews() {
    previewList.innerHTML = '';
    selectedFiles.forEach((f, i) => renderThumb(f, i));
  }

  fileInput.addEventListener('change', function() {
    addFiles(this.files);
    this.value = '';
  });

  dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });

  // ── Form submit ────────────────────────────────────────────────
  const form       = document.getElementById('upload-form');
  const submitBtn  = document.getElementById('submit-btn');
  const submitLbl  = document.getElementById('submit-label');
  const progressWr = document.getElementById('progress-wrap');
  const progressBr = document.getElementById('progress-bar');
  const progressLb = document.getElementById('progress-label');
  const resultMsg  = document.getElementById('result-msg');
  const uploadLog  = document.getElementById('upload-log');

  function setProgress(pct, label) {
    progressBr.style.width = pct + '%';
    progressLb.textContent = label;
  }

  function logItem(name, state, message) {
    let item = document.querySelector(`.log-item[data-name="${CSS.escape(name)}"]`);
    if (!item) {
      item = document.createElement('div');
      item.className = 'log-item';
      item.dataset.name = name;
      uploadLog.appendChild(item);
    }
    item.className = 'log-item ' + state;
    const icon = state === 'ok' ? 'fa-check-circle' : state === 'err' ? 'fa-times-circle' : 'fa-spinner fa-spin';
    item.innerHTML = `<i class="fas ${icon} log-icon"></i><span>${name}: ${message}</span>`;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Validate
    const services = [...document.querySelectorAll('input[name="service"]:checked')].map(c => c.value);
    const description = descEl.value.trim();
    const techName = document.getElementById('tech-name').value.trim();

    if (services.length === 0) {
      showResult('error', 'Please select at least one service.');
      return;
    }
    if (!techName) {
      showResult('error', 'Please enter your name.');
      return;
    }
    if (selectedFiles.length === 0) {
      showResult('error', 'Please select at least one photo.');
      return;
    }

    // UI — start
    submitBtn.disabled = true;
    submitLbl.textContent = 'Uploading…';
    progressWr.classList.add('visible');
    resultMsg.className = 'result-msg';
    resultMsg.textContent = '';
    uploadLog.innerHTML = '';

    const total = selectedFiles.length;
    let done = 0;
    let errors = 0;

    for (const file of selectedFiles) {
      logItem(file.name, 'uploading', 'uploading…');
      try {
        const fd = new FormData();
        fd.append('service', services.join(', '));
        fd.append('description', description);
        fd.append('tech_name', techName);
        fd.append('photo', file, file.name);

        const res = await fetch('/upload', { method: 'POST', body: fd });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok) {
          logItem(file.name, 'ok', 'uploaded ✓');
        } else {
          logItem(file.name, 'err', data.error || 'upload failed');
          errors++;
        }
      } catch (err) {
        logItem(file.name, 'err', err.message || 'network error');
        errors++;
      }
      done++;
      setProgress(Math.round((done / total) * 100), `${done} of ${total} photos`);
    }

    // Done
    submitBtn.disabled = false;
    submitLbl.textContent = 'Upload Photos';

    if (errors === 0) {
      showResult('success', `✓ All ${total} photo${total !== 1 ? 's' : ''} uploaded successfully! We'll get notified right away.`);
      selectedFiles = [];
      refreshPreviews();
      form.reset();
    } else if (errors < total) {
      showResult('error', `${done - errors} uploaded, ${errors} failed. Check the list above and try again.`);
    } else {
      showResult('error', 'Upload failed. Please check your connection and try again.');
    }
  });

  function showResult(type, msg) {
    resultMsg.className = 'result-msg ' + type;
    resultMsg.textContent = msg;
    resultMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

})();
</script>
</body>
</html>
