<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Upload | Sunflower Plumbing & Excavation</title>
  <meta name="description" content="Internal photo upload portal for Sunflower Plumbing service technicians.">
  <link rel="canonical" href="https://www.sunflowerplumbing.com/upload/">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <meta name="robots" content="noindex, nofollow">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .upload-page {
      min-height: 70vh;
      padding: 60px 0 80px;
      background: var(--light-bg, #f8f6f2);
    }
    .upload-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 44px;
    }
    @media (max-width: 640px) {
      .upload-card { padding: 32px 20px; }
    }
    .upload-card h1 {
      font-size: 26px;
      color: var(--black, #121315);
      margin: 0 0 6px;
    }
    .upload-card .subtitle {
      color: #666;
      font-size: 15px;
      margin: 0 0 36px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #444;
      margin-bottom: 8px;
    }
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      color: var(--black, #121315);
      background: #fafafa;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--yellow, #FCAF18);
      background: #fff;
    }
    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .select-hint {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    /* Voice description */
    .desc-wrapper {
      position: relative;
    }
    .voice-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: var(--yellow, #FCAF18);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--black, #121315);
      font-size: 15px;
      transition: background 0.2s, transform 0.1s;
    }
    .voice-btn:hover { background: #e09c0f; }
    .voice-btn.listening {
      background: #e53935;
      color: #fff;
      animation: pulse-mic 1s infinite;
    }
    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .voice-hint {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }
    .no-voice .voice-btn { display: none; }

    /* File drop zone */
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafafa;
      position: relative;
    }
    .drop-zone.dragover,
    .drop-zone:hover {
      border-color: var(--yellow, #FCAF18);
      background: #fffbf0;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon {
      font-size: 36px;
      color: #ccc;
      margin-bottom: 10px;
    }
    .drop-zone:hover .drop-icon,
    .drop-zone.dragover .drop-icon { color: var(--yellow, #FCAF18); }
    .drop-label {
      font-size: 16px;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 4px;
    }
    .drop-sub {
      font-size: 13px;
      color: #888;
    }

    /* Preview thumbnails */
    #preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .preview-thumb {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      border: 2px solid #eee;
      position: relative;
    }
    .thumb-wrap {
      position: relative;
      display: inline-block;
    }
    .thumb-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    /* Submit button */
    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: var(--yellow, #FCAF18);
      color: var(--black, #121315);
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .submit-btn:hover:not(:disabled) { background: #e09c0f; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Progress bar */
    .progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-track {
      background: #eee;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--yellow, #FCAF18);
      border-radius: 99px;
      transition: width 0.3s;
      width: 0%;
    }
    .progress-label {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      text-align: center;
    }

    /* Result messages */
    .result-msg {
      display: none;
      padding: 16px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 18px;
      text-align: center;
    }
    .result-msg.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .result-msg.error {
      display: block;
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    /* Upload log */
    #upload-log {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .log-item .log-icon { font-size: 14px; }
    .log-item.ok .log-icon { color: #2e7d32; }
    .log-item.err .log-icon { color: #c62828; }
    .log-item.uploading .log-icon { color: #888; }
  </style>
</head>
<body>
<!-- HEADER -->

<section class="upload-page">
  <div class="container">

    <div class="upload-card">
      <h1><i class="fas fa-camera" style="color:var(--yellow,#FCAF18);margin-right:10px;"></i>Photo Upload</h1>
      <p class="subtitle">Select a service, pick your photos, hit upload — done. Description is optional.</p>

      <form id="upload-form" novalidate>

        <!-- Service single-select dropdown -->
        <div class="form-group">
          <label for="service">Service <span style="color:#e53935;">*</span></label>
          <select id="service" name="service" required>
            <option value="" disabled selected>— Pick a service —</option>
            <option value="Drain Cleaning">Drain Cleaning</option>
            <option value="Fixture Replacement">Fixture Replacement</option>
            <option value="Gas Line Services">Gas Line Services</option>
            <option value="Kitchen &amp; Bathroom Plumbing">Kitchen &amp; Bathroom Plumbing</option>
            <option value="Leak Detection">Leak Detection</option>
            <option value="Sewer Line Repair">Sewer Line Repair</option>
            <option value="Toilet &amp; Faucet Repair">Toilet &amp; Faucet Repair</option>
            <option value="Water Heater Repair">Water Heater Repair</option>
            <option value="Water Softener Installation">Water Softener Installation</option>
            <option value="Lateral Field Installation">Lateral Field Installation</option>
            <option value="Backfill &amp; Grading">Backfill &amp; Grading</option>
            <option value="Emergency Excavation">Emergency Excavation</option>
            <option value="Septic System Excavation">Septic System Excavation</option>
            <option value="Sewer &amp; Water Line Excavation">Sewer &amp; Water Line Excavation</option>
            <option value="Site Preparation">Site Preparation</option>
            <option value="Trenching">Trenching</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Description with voice-to-text -->
        <div class="form-group">
          <label for="description">Description <span style="color:#aaa;font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;">(optional)</span></label>
          <div class="desc-wrapper" id="desc-wrapper">
            <textarea id="description" name="description" placeholder="Optional — location, before/after, what was wrong, etc. Tap the mic to dictate." rows="3"></textarea>
            <button type="button" class="voice-btn" id="voice-btn" title="Tap to use voice-to-text" aria-label="Start voice input">
              <i class="fas fa-microphone" id="mic-icon"></i>
            </button>
          </div>
          <p class="voice-hint" id="voice-hint">Tap the <i class="fas fa-microphone"></i> button to dictate a description.</p>
        </div>

        <!-- Submitter name -->
        <div class="form-group">
          <label for="tech-name">Your Name <span style="color:#e53935;">*</span></label>
          <input type="text" id="tech-name" name="tech_name" placeholder="First name + last initial (e.g. Cayla S)"
            style="width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;color:#121315;background:#fafafa;box-sizing:border-box;">
        </div>

        <!-- File picker -->
        <div class="form-group">
          <label>Photos <span style="color:#e53935;">*</span></label>
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" name="photos" accept="image/*,image/heic,image/heif,video/*" multiple>
            <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <span class="drop-label">Tap to select photos</span>
            <span class="drop-sub">or drag &amp; drop here &bull; Photos, Videos, HEIC</span>
          </div>
          <div id="preview-list"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <i class="fas fa-upload"></i>
          <span id="submit-label">Upload Photos</span>
        </button>

        <!-- Progress -->
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
          <div class="progress-label" id="progress-label">Uploading…</div>
        </div>

        <!-- Upload log -->
        <div id="upload-log"></div>

        <!-- Result -->
        <div class="result-msg" id="result-msg"></div>

      </form>
    </div>

  </div>
</section>

<!-- FOOTER -->

<script src="/js/main.js"></script>
<script>
(function() {
  'use strict';

  // ── Helpers ────────────────────────────────────────────────────
  function safeName(file) {
    return (file && typeof file.name === 'string' && file.name) ? file.name : 'photo';
  }
  function isHeicFile(file) {
    var n = safeName(file).toLowerCase();
    var t = (file && file.type) ? file.type.toLowerCase() : '';
    return /\.(heic|heif)$/.test(n) || t === 'image/heic' || t === 'image/heif';
  }
  function isAccepted(file) {
    if (!file) return false;
    var t = (file.type || '');
    var n = safeName(file).toLowerCase();
    return t.startsWith('image/') || t.startsWith('video/') || isHeicFile(file)
      || /\.(jpe?g|png|gif|webp|bmp|tiff?|mp4|mov|avi|mkv|webm|m4v)$/.test(n);
  }

  // ── Voice to text ──────────────────────────────────────────────
  const voiceBtn  = document.getElementById('voice-btn');
  const micIcon   = document.getElementById('mic-icon');
  const voiceHint = document.getElementById('voice-hint');
  const descEl    = document.getElementById('description');
  const descWrap  = document.getElementById('desc-wrapper');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if (!SpeechRecognition) {
    descWrap.classList.add('no-voice');
    voiceHint.textContent = 'Voice input not supported in this browser — type your description above.';
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    let finalTranscript = '';

    recognition.onresult = function(e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript + ' ';
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      descEl.value = finalTranscript + interim;
    };

    recognition.onerror = function(e) {
      stopListening();
      if (e.error !== 'aborted') {
        voiceHint.textContent = 'Mic error: ' + e.error + '. Try typing instead.';
      }
    };

    recognition.onend = function() { stopListening(); };

    voiceBtn.addEventListener('click', function() {
      if (listening) {
        recognition.stop();
      } else {
        finalTranscript = descEl.value.trimEnd() + (descEl.value.trimEnd() ? ' ' : '');
        recognition.start();
        listening = true;
        voiceBtn.classList.add('listening');
        micIcon.className = 'fas fa-stop';
        voiceHint.textContent = 'Listening… tap again to stop.';
      }
    });
  }

  function stopListening() {
    listening = false;
    voiceBtn.classList.remove('listening');
    micIcon.className = 'fas fa-microphone';
    voiceHint.textContent = 'Tap the mic button to dictate a description.';
  }

  // ── File picker & previews ─────────────────────────────────────
  const fileInput   = document.getElementById('file-input');
  const dropZone    = document.getElementById('drop-zone');
  const previewList = document.getElementById('preview-list');
  let selectedFiles = [];

  function isAccepted(file) {
    if (!file) return false;
    const type = file.type || '';
    const name = (file.name || '').toLowerCase();
    return type.startsWith('image/') || type.startsWith('video/')
      || /\.(heic|heif|jpe?g|png|gif|webp|bmp|tiff?|mp4|mov|avi|mkv|webm|m4v)$/.test(name);
  }

  function addFiles(fileList) {
    for (var i = 0; i < fileList.length; i++) {
      var f = fileList[i];
      if (!isAccepted(f)) continue;
      var fname = safeName(f);
      var fsize = f.size || 0;
      if (selectedFiles.some(function(x) { return safeName(x) === fname && (x.size||0) === fsize; })) continue;
      selectedFiles.push(f);
      renderThumb(f, selectedFiles.length - 1);
    }
  }

  function renderThumb(file, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.dataset.idx = idx;

    var isVideo = (file && file.type) ? file.type.startsWith('video/') : false;
    var isHeic  = isHeicFile(file);
    var mediaEl;
    if (isHeic) {
      mediaEl = document.createElement('div');
      mediaEl.className = 'preview-thumb';
      mediaEl.style.cssText = 'display:flex;align-items:center;justify-content:center;background:#f0f0f0;font-size:11px;color:#666;text-align:center;padding:4px;box-sizing:border-box;';
      mediaEl.textContent = safeName(file).replace(/\.[^.]+$/, '').slice(-8) || 'HEIC';
    } else {
      mediaEl = document.createElement(isVideo ? 'video' : 'img');
      mediaEl.className = 'preview-thumb';
      mediaEl.alt = safeName(file);
      if (isVideo) { mediaEl.muted = true; mediaEl.preload = 'metadata'; }
      try {
        var url = URL.createObjectURL(file);
        mediaEl.src = url;
        mediaEl.onload = function() { URL.revokeObjectURL(url); };
        if (isVideo) mediaEl.onloadedmetadata = function() { URL.revokeObjectURL(url); };
      } catch(e) { /* can't preview */ }
    }

    const rm = document.createElement('button');
    rm.className = 'thumb-remove';
    rm.type = 'button';
    rm.innerHTML = '&times;';
    rm.title = 'Remove';
    rm.onclick = function() {
      selectedFiles.splice(idx, 1);
      refreshPreviews();
    };

    wrap.appendChild(mediaEl);
    wrap.appendChild(rm);
    previewList.appendChild(wrap);
  }

  function refreshPreviews() {
    previewList.innerHTML = '';
    selectedFiles.forEach((f, i) => renderThumb(f, i));
  }

  fileInput.addEventListener('change', function() {
    addFiles(this.files);
    this.value = '';
  });

  dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });

  // ── Form submit ────────────────────────────────────────────────
  const form       = document.getElementById('upload-form');
  const submitBtn  = document.getElementById('submit-btn');
  const submitLbl  = document.getElementById('submit-label');
  const progressWr = document.getElementById('progress-wrap');
  const progressBr = document.getElementById('progress-bar');
  const progressLb = document.getElementById('progress-label');
  const resultMsg  = document.getElementById('result-msg');
  const uploadLog  = document.getElementById('upload-log');

  function setProgress(pct, label) {
    progressBr.style.width = pct + '%';
    progressLb.textContent = label;
  }

  function logItem(label, state, message) {
    var safeLabel = (label != null && label !== '') ? String(label) : 'file';
    var escaped = safeLabel.replace(/[\\"']/g, '_');
    var item = uploadLog.querySelector('[data-log="' + escaped + '"]');
    if (!item) {
      item = document.createElement('div');
      item.className = 'log-item';
      item.setAttribute('data-log', escaped);
      uploadLog.appendChild(item);
    }
    item.className = 'log-item ' + state;
    var icon = state === 'ok' ? 'fa-check-circle' : state === 'err' ? 'fa-times-circle' : 'fa-spinner fa-spin';
    var safeMsg = String(message || '').replace(/</g, '&lt;');
    var safeDisp = safeLabel.replace(/</g, '&lt;');
    item.innerHTML = '<i class="fas ' + icon + ' log-icon"></i><span>' + safeDisp + ': ' + safeMsg + '</span>';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Validate
    const service = document.getElementById('service').value.trim();
    const description = descEl.value.trim();
    const techName = document.getElementById('tech-name').value.trim();

    if (!service) {
      showResult('error', 'Please select a service.');
      return;
    }
    if (!techName) {
      showResult('error', 'Please enter your name.');
      return;
    }
    if (selectedFiles.length === 0) {
      showResult('error', 'Please select at least one photo.');
      return;
    }

    // UI — start
    submitBtn.disabled = true;
    submitLbl.textContent = 'Uploading…';
    progressWr.classList.add('visible');
    resultMsg.className = 'result-msg';
    resultMsg.textContent = '';
    uploadLog.innerHTML = '';

    const total = selectedFiles.length;
    let done = 0;
    let errors = 0;

    for (var fi = 0; fi < selectedFiles.length; fi++) {
      var file = selectedFiles[fi];
      var displayName = safeName(file);
      logItem(displayName, 'uploading', 'uploading…');
      try {
        var uploadFile = file;
        var uploadName = /\./.test(displayName) ? displayName : displayName + '.jpg';

        // HEIC files upload as-is (Drive stores them fine; techs should use Most Compatible mode)

        logItem(displayName, 'uploading', 'uploading…');
        var fd = new FormData();
        fd.append('service', service);
        fd.append('description', description);
        fd.append('tech_name', techName);
        fd.append('photo', uploadFile, uploadName);

        var res = await fetch('/upload', { method: 'POST', body: fd });
        var data = await res.json().catch(function() { return {}; });

        if (res.ok && data.ok) {
          logItem(displayName, 'ok', 'uploaded ✓');
        } else {
          logItem(displayName, 'err', data.error || 'upload failed');
          errors++;
        }
      } catch (err) {
        logItem(displayName, 'err', (err && err.message) ? err.message : 'network error');
        errors++;
      }
      done++;
      setProgress(Math.round((done / total) * 100), `${done} of ${total} photos`);
    }

    // Done
    submitBtn.disabled = false;
    submitLbl.textContent = 'Upload Photos';

    if (errors === 0) {
      showResult('success', `✓ All ${total} photo${total !== 1 ? 's' : ''} uploaded successfully! We'll get notified right away.`);
      selectedFiles = [];
      refreshPreviews();
      form.reset();
    } else if (errors < total) {
      showResult('error', `${done - errors} uploaded, ${errors} failed. Check the list above and try again.`);
    } else {
      showResult('error', 'Upload failed. Please check your connection and try again.');
    }
  });

  function showResult(type, msg) {
    resultMsg.className = 'result-msg ' + type;
    resultMsg.textContent = msg;
    resultMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

})();
</script>
</body>
</html>
