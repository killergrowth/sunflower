<div class="blog-card blog-featured-card">
  <a href="{{url}}" class="blog-featured-img">
    <img src="{{image}}" alt="{{title}}" loading="lazy" width="400" height="220">
  </a>
  <div class="blog-date">{{month_year}}</div>
  <h3><a href="{{url}}">{{title}}</a></h3>
  {{excerpt_html}}
  <a href="{{url}}" class="service-link">Read more <i class="fas fa-arrow-right"></i></a>
</div>
