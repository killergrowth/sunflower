<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{page_meta}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  {{base_head}}
  <style>
    .blog-post-section { padding: 80px 0; background: var(--white, #fff); }
    .blog-post-inner { max-width: 800px; margin: 0 auto; }
    .blog-post-hero-img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 6px; margin-bottom: 32px; display: block; }
    .blog-post-meta {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 2px; color: var(--subtle, #888);
      margin-bottom: 24px; display: flex; gap: 20px; flex-wrap: wrap;
    }
    .blog-post-body { color: var(--body, #333); font-size: 16px; line-height: 1.8; }
    .blog-post-body h1,
    .blog-post-body h2 { font-family: 'Barlow Condensed', sans-serif; color: var(--heading, #1a1a1a); font-size: 26px; font-weight: 700; margin: 32px 0 14px; }
    .blog-post-body h3 { font-family: 'Barlow Condensed', sans-serif; color: var(--heading, #1a1a1a); font-size: 20px; font-weight: 700; margin: 24px 0 10px; }
    .blog-post-body p { margin: 0 0 18px; }
    .blog-post-body ul, .blog-post-body ol { margin: 0 0 18px 24px; }
    .blog-post-body li { margin-bottom: 8px; line-height: 1.7; }
    .blog-post-body a { color: var(--yellow, #f5c400); font-weight: 600; }
    .blog-post-body strong { color: var(--heading, #1a1a1a); }
    .blog-post-body blockquote { border-left: 4px solid var(--yellow, #f5c400); background: #fafafa; padding: 16px 20px; margin: 24px 0; color: #444; }
    .blog-post-body img { max-width: 100%; height: auto; border-radius: 6px; margin: 16px 0; }
    .blog-post-back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--subtle, #888); text-decoration: none; margin-bottom: 32px; }
    .blog-post-back:hover { color: var(--yellow, #f5c400); }
  </style>
</head>
<body>

{{header}}

<section class="page-hero">
  <div class="container page-hero-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span>/</span>
      <a href="/blog/">Blog</a>
      <span>/</span>
      <span>{{title}}</span>
    </nav>
    <h1>{{title}}</h1>
  </div>
</section>

<section class="blog-post-section">
  <div class="container">
    <div class="blog-post-inner">
      <a href="/blog/" class="blog-post-back"><i class="fas fa-arrow-left"></i> Back to Blog</a>
      {{featured_image_html}}
      <div class="blog-post-meta">
        {{date_html}}
        {{author_html}}
      </div>
      <div class="blog-post-body">
        {{content}}
      </div>
    </div>
  </div>
</section>

<section class="call-band">
  <div class="container">
    <h2>Need a Plumber <em>Today?</em></h2>
    <p>Sunflower Plumbing is available 24/7 for emergencies. Call us now or book online.</p>
    <div class="call-band-ctas">
      <a href="tel:+13163336326" class="btn">
        <span>Call (316) 333-6326</span>
        <span class="btn-icon"><i class="fas fa-phone"></i></span>
      </a>
    </div>
  </div>
</section>

{{footer}}

<script src="/js/main.js"></script>
</body>
</html>
